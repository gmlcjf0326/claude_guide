# COMPASS development compose — hot reload + healthcheck-gated startup
# 🇰🇷 개발용 compose: 소스 핫리로드 + DB가 실제로 응답한 뒤에만 앱 시작.
services:
  app:
    build:
      context: .
      target: deps            # stop at deps stage; dev server runs on top of it
    command: pnpm dev
    volumes:
      - .:/app                # hot reload
      - /app/node_modules     # mask host node_modules with container's
    env_file:
      - path: .env            # gitignored — never bake into images
        required: false       # fresh clones have no .env yet — don't fail startup
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
